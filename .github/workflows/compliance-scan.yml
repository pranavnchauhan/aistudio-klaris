name: compliance-scan

# Secret + dependency scanning (compliance-agent backlog #128).
# - gitleaks: detect secrets in the working tree + git history (every push).
# - trufflehog: detect + verify secrets across history (every push).
# - trivy: dependency CVE + licence + SBOM (every push + weekly, so a new CVE
#   surfaces even when no commit lands).

on:
  push:
  pull_request:
  schedule:
    - cron: "30 19 * * 0"   # Sundays ~06:30 Sydney (19:30 UTC prev day)

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: trufflehog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  trivy:
    name: trivy (CVE + licence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy fs scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,license
          exit-code: 1
          severity: CRITICAL,HIGH
